<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>比赛周 · Rate90</title>
</head>
<body>
  <a href="./index.html?view=round&amp;league=pl#view=round&amp;league=pl">打开比赛周</a>
  <script>
    const query = new URLSearchParams(location.search);
    const fragment = new URLSearchParams(location.hash.slice(1));
    const file = location.protocol === 'file:';
    const read = key => file ? fragment.get(key) || query.get(key) : query.get(key) || fragment.get(key);
    const route = new URLSearchParams({ view: 'round', league: read('league') || 'pl' });
    for (const key of ['round', 'match']) {
      const value = read(key);
      if (value) route.set(key, value);
    }
    const target = new URL('./index.html', location.href);
    if (file) target.hash = route.toString();
    else target.search = route.toString();
    location.replace(target.href);
  </script>
</body>
</html>
