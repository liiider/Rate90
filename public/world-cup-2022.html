<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2022 世界杯比赛档案，收录三场比赛的常规时间射门分布与预期进球。">
  <title>2022 世界杯 · Rate90</title>
  <link rel="icon" href="./ui/mark.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --ink: #152b22; --paper: #f7f7f1; --line: #cbd4c9; --muted: #53635b; --green: #174d3b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.65 Inter, "Microsoft YaHei", system-ui, sans-serif; }
    header { border-bottom: 1px solid var(--line); }
    .wrap { max-width: 860px; margin: auto; padding: 0 24px; }
    .nav, .foot, .title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .nav { height: 65px; }
    .brand { color: inherit; text-decoration: none; font: 900 italic 28px/1 Arial, sans-serif; letter-spacing: -1.5px; }
    .brand b { color: #518047; }
    .meta, .dates, footer { color: var(--muted); font-size: 13px; }
    .intro { margin: 34px 0; padding: 30px 36px; background: var(--green); color: white; border-radius: 5px; position: relative; overflow: hidden; }
    .pitch { position: absolute; right: -6%; top: 15%; width: 33%; height: 110%; border: 1px solid #699581; transform: rotate(-14deg); pointer-events: none; }
    .pitch::after, .pitch::before { content: ""; position: absolute; }
    .pitch::after { width: 33%; aspect-ratio: 1; border-radius: 50%; border: 1px solid #699581; left: 33%; top: 24%; }
    .pitch::before { height: 100%; border-left: 1px solid #699581; left: 50%; }
    h1 { position: relative; margin: 0; font-size: clamp(28px, 5vw, 46px); letter-spacing: -.055em; }
    .title { align-items: baseline; }
    h2 { margin: 0; font-size: 21px; }
    .match { border-bottom: 1px solid var(--line); padding: 18px 0; }
    .match h3 { margin: 6px 0 12px; font-size: 25px; letter-spacing: -.04em; }
    .versus { padding: 0 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
    summary { width: fit-content; min-height: 40px; padding: 6px 13px; border: 1px solid #aebdb1; border-radius: 4px; color: var(--green); font-weight: 600; cursor: pointer; }
    summary:hover { background: #e8ecdf; }
    :focus-visible { outline: 3px solid #54973e; outline-offset: 2px; }
    .detail { margin-top: 14px; padding: 16px 20px; border-radius: 4px; background: #eaf0e6; }
    .detail p { margin: 0 0 10px; }
    table { table-layout: fixed; width: 100%; max-width: 510px; margin: 0 0 14px; border-spacing: 4px 0; }
    caption { text-align: left; font-weight: 600; }
    th, td { vertical-align: bottom; color: var(--muted); text-align: left; font-size: 12px; font-variant-numeric: tabular-nums; }
    td::after { content: ""; display: block; height: var(--bar-height); background: #598666; border-radius: 2px 2px 0 0; }
    .source, .foot a { color: var(--green); }
    .source { font-size: 13px; }
    .foot { padding: 24px 0 32px; flex-wrap: wrap; }
    .foot img { width: 88px; max-height: 43px; object-fit: contain; }
    .foot p { margin: 0; }
    @media (max-width: 560px) {
      .wrap { padding: 0 16px; }
      .intro { margin: 20px 0; padding: 23px 20px; }
      .match h3 { font-size: 22px; }
      .detail { padding: 13px 10px; }
      table { border-spacing: 2px 0; }
      th, td { font-size: 11px; }
      .pitch { opacity: .48; }
      .nav { height: 54px; }
    }
  </style>
</head>

  <template id="statistics">
    <details>
      <summary>比赛数据</summary>
      <div class="detail">
        <p class="totals"></p>
        <table>
          <caption>每 15 分钟的射门次数</caption>
          <thead><tr><th scope="col">1–15′</th><th scope="col">16–30′</th><th scope="col">31–45′+</th><th scope="col">46–60′</th><th scope="col">61–75′</th><th scope="col">76–90′+</th></tr></thead>
          <tbody><tr></tr></tbody>
        </table>
        <a class="source" rel="noreferrer" target="_blank">StatsBomb 原始事件记录 ↗</a>
      </div>
    </details>
  </template>
  <script>
    const template = document.getElementById('statistics');
    for (const match of document.querySelectorAll('.match')) {
      const fragment = template.content.cloneNode(true);
      const shots = match.dataset.windows.split(',').map(Number);
      const total = shots.reduce((sum, count) => sum + count, 0);
      fragment.querySelector('.totals').textContent =
        '常规时间 · 双方共 ' + total + ' 次射门 · 总 xG ' + match.dataset.xg;
      const row = fragment.querySelector('tbody tr');
      const peak = Math.max(...shots, 1);
      for (const count of shots) {
        const cell = row.insertCell();
        cell.textContent = count;
        cell.style.setProperty('--bar-height', (count / peak * 44) + 'px');
      }
      fragment.querySelector('.source').href =
        'https://github.com/hudl/open-data/blob/master/data/events/' + match.dataset.event + '.json';
      match.append(fragment);
    }
  </script>
